<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>아르카나 수비대 — 프로토타입</title>
<style>
:root{
  --bg:#17143a; --panel:#221e4a; --panel2:#2d2860; --line:#3d3780; --ink:#f5f2ff; --mut:#aaa4d6;
  --gold:#ffd166; --good:#38d996; --bad:#ff5d73; --info:#7cc7ff;
  --wand:#ff7a45; --cup:#4cc9f0; --sword:#8ee3a8; --pentacle:#e9c46a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0a1f;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
body{display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
@media (min-height:760px){ body{align-items:center} }
#app{position:relative;width:100%;max-width:360px;height:100vh;max-height:740px;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (min-width:420px){ #app{border-radius:14px;box-shadow:0 0 0 1px #2f2a66,0 20px 60px #0008} }
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* HUD */
#hud{padding:6px 8px 4px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;gap:6px;align-items:center}
.stat{flex:1;min-width:0;background:var(--panel2);border-radius:8px;padding:3px 6px;font-size:13px;line-height:1.25;white-space:nowrap}
.stat b{font-size:15px}
.stat small{color:var(--mut);font-size:11px;margin-left:3px}
.bar{height:4px;background:#0006;border-radius:3px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
#hpBar{background:var(--good)} #hpBox.low #hpBar{background:var(--bad)}
#hpBox.hit{animation:hit .3s}
@keyframes hit{0%,100%{background:var(--panel2)}50%{background:#7a2340}}
.combo{margin-top:4px;font-size:12px;color:var(--mut)}
.combo b{color:var(--ink);font-size:14px;min-width:16px;display:inline-block;text-align:center}
#pips{display:flex;gap:3px;flex:1}
#pips span{flex:1;height:8px;border-radius:3px;background:#0006;position:relative}
#pips span.on{background:var(--info)}
#pips span.mark::after{content:attr(data-m);position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:8px;line-height:10px;color:#fff;font-weight:700}
#badges{display:flex;gap:3px}
.badge{font-size:11px;padding:1px 5px;border-radius:6px;background:#0005;color:var(--ink);white-space:nowrap}
.badge.disc{background:#2d6a4f}.badge.buff{background:#9d4edd}.badge.ult{background:#c9184a}

/* Stage */
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#120f2e}
#map{display:block;touch-action:none}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;
  background:#000b;border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:10px;font-weight:700;font-size:15px;
  opacity:0;transition:opacity .25s;white-space:nowrap;text-align:center}
#banner.show{opacity:1}
#popup{position:absolute;z-index:5;width:232px;background:#1b1842f2;border:1px solid var(--gold);border-radius:12px;padding:8px;box-shadow:0 8px 24px #000a}
#popup[hidden]{display:none}
.ptitle{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.ptitle button{background:none;border:0;color:var(--mut);font-size:15px;padding:0 4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbtn{border:2px solid var(--c);background:#0004;border-radius:9px;padding:5px 4px;text-align:left;font-size:12px;line-height:1.25}
.pbtn .ic{font-size:16px;margin-right:2px}
.pbtn small{display:block;color:var(--mut);font-size:10.5px}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pinfo{font-size:12px;color:var(--mut);line-height:1.45;margin-bottom:6px}
.pinfo b{color:var(--ink)}
.upbtn{width:100%;border:2px solid var(--gold);background:#4a3b0a;border-radius:9px;padding:7px;font-weight:700;font-size:14px}
.upbtn:disabled{opacity:.4;cursor:not-allowed}

/* Quiz */
#quiz{flex:none;margin:6px 8px 0;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px 8px}
#quiz.warn{animation:blink .5s steps(2) infinite}
@keyframes blink{0%{border-color:var(--gold)}100%{border-color:var(--bad)}}
.qhead{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);min-height:16px}
#qFeedback.good{color:var(--good)} #qFeedback.bad{color:var(--bad)} #qFeedback.skip{color:var(--gold)}
#qText{font-size:22px;font-weight:700;text-align:center;margin:2px 0 4px;min-height:30px;word-break:keep-all}
.idle{height:3px;background:#0005;border-radius:2px;overflow:hidden;margin-bottom:6px}
.idle i{display:block;height:100%;width:0;background:var(--mut)}
#quiz.warn .idle i{background:var(--bad)}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ch{position:relative;min-height:44px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:18px;font-weight:700;padding:4px 6px 4px 22px}
.ch .k{position:absolute;left:6px;top:4px;font-size:10px;color:var(--mut);font-weight:400}
.ch:active{transform:scale(.98)}
.ch.correct{background:#145c43;border-color:var(--good)}
.ch.correct::after{content:" ✓"}
.ch.wrong{background:#6a1d2c;border-color:var(--bad)}
.ch.wrong::after{content:" ✗"}
#quiz.locked .ch{pointer-events:none}
#quiz.idlemode{opacity:.55}

/* Card bar */
#cardbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr) 1.15fr;gap:5px;padding:6px 8px 8px}
.card{position:relative;border:2px solid var(--c);background:#0003;border-radius:10px;padding:3px 2px 4px;text-align:center;font-size:11px;line-height:1.2}
.card .ic{font-size:18px;display:block}
.card .k{position:absolute;left:4px;top:2px;font-size:9.5px;color:var(--mut)}
.card .cost{color:var(--gold);font-weight:700}
.card.sel{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 0 2px #fff inset}
.card.poor{opacity:.5}
#ultBtn{border:2px solid #ff4d8d;background:#3a0f22;border-radius:10px;font-size:11px;line-height:1.2;padding:3px 2px;color:#ffb3cd}
#ultBtn .ic{font-size:18px;display:block}
#ultBtn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.8)}
#ultBtn.ready{animation:pulse 1s infinite;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 14px #ff4d8d}}

/* Overlay */
#overlay{position:absolute;inset:0;z-index:10;background:#0c0a1fe8;display:flex;align-items:center;justify-content:center;padding:14px}
#overlay[hidden]{display:none}
.panel{width:100%;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h1{margin:0 0 4px;font-size:24px;text-align:center}
.panel h2{margin:12px 0 6px;font-size:14px;color:var(--mut)}
.panel p{font-size:13px;line-height:1.55;margin:6px 0;color:#ddd8ff}
.panel ul{margin:4px 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:#ddd8ff}
.stars{text-align:center;font-size:40px;letter-spacing:6px;color:var(--gold);margin:4px 0}
.stars .off{color:#4a4570}
.crit{font-size:12.5px;line-height:1.7}
.crit .ok{color:var(--good)} .crit .no{color:var(--mut)}
.big{display:block;width:100%;margin-top:10px;padding:11px;border-radius:11px;border:0;background:var(--gold);color:#241a00;font-weight:800;font-size:16px}
.sec{display:block;width:100%;margin-top:8px;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
.sec:disabled{opacity:.4}
.sealed{display:flex;flex-direction:column;gap:4px}
.sealed button{text-align:left;border:1px dashed #8a7fd0;background:#0003;border-radius:8px;padding:6px 8px;font-size:13px}
.sealed button.new::after{content:"NEW";font-size:9px;background:var(--bad);color:#fff;border-radius:4px;padding:0 3px;margin-left:6px;vertical-align:middle}
.sealed button.freed{border-style:solid;border-color:var(--good);text-decoration:line-through;opacity:.6}
#review{margin-top:8px}
#review .rq{font-size:20px;font-weight:700;text-align:center;margin:6px 0}
#review .rmsg{font-size:13px;text-align:center;min-height:18px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats{font-size:12.5px;color:#ddd8ff;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hrow">
      <div class="stat" id="hpBox" title="탑 HP">🏰 <b id="hpTxt">10</b><small id="hpMax">/10</small> <span id="shieldTxt"></span><div class="bar"><i id="hpBar"></i></div></div>
      <div class="stat" id="manaBox" title="마나 (아래 막대 = 자동 회복까지)">💎 <b id="manaTxt">0</b><small>마나</small><div class="bar"><i id="manaBar"></i></div></div>
      <div class="stat" id="waveBox" title="웨이브">🌫️ <b id="waveTxt">1/5</b><small id="phaseTxt"></small></div>
    </div>
    <div class="hrow combo">콤보 <b id="comboTxt">0</b><div id="pips"></div><div id="badges"></div></div>
  </header>

  <div id="stage">
    <canvas id="map" aria-label="게임 맵"></canvas>
    <div id="popup" hidden></div>
    <div id="banner"></div>
  </div>

  <section id="quiz" aria-live="polite">
    <div class="qhead"><span id="qDiff"></span><span id="qFeedback"></span></div>
    <div id="qText"></div>
    <div class="idle"><i id="idleBar"></i></div>
    <div id="choices"></div>
  </section>

  <nav id="cardbar"></nav>

  <div id="overlay"></div>
</div>

<script>
'use strict';
/* =====================================================================
 * BALANCE — 조정 가능한 모든 수치는 여기 한 곳에 모아 둔다.
 * (브리프 00_brief.md §4 고정 수치: 탑 HP 10, 정답 마나 3/4/5, 자동 회복 1/5초,
 *  소환 5, 강화 4/6/8, 웨이브 5, 콤보 3/5/8, 10초 방치 자동 교체)
 * ===================================================================== */
const BALANCE = {
  tower: { hp: 10, shieldCap: 5 },                 // 보호막 1 = 피해 1 흡수
  mana: {
    start: 5,                                       // 시작 마나(+ 해제 퀴즈 보너스)
    max: 99,
    regenAmount: 1, regenEvery: 5,                  // 자동 회복 1마나 / 5초
    byDifficulty: { 1: 3, 2: 4, 3: 5 },             // 정답 마나 (쉬움/보통/어려움)
  },
  cost: { summon: 5, upgrade: [4, 6, 8] },          // upgrade[n-1] = Lv n → n+1 (프로토타입은 Lv3까지 → 4, 6 사용)
  maxLevel: 3,
  quiz: {
    idleWarnSec: 7,                                 // 7초부터 테두리 점멸
    idleSkipSec: 10,                                // 10초에 자동 교체("회피" 기록)
    correctDelay: 0.35,                             // 정답 후 다음 문제까지(초)
    wrongLockSec: 2.0,                              // 오답 후 잠금(초) — 찍기 억제
  },
  combo: {
    cycle: 8,                                       // 8콤보마다 보상 주기 반복(11/13/16…)
    discountAt: 3, discountAmount: 2,               // 콤보 3: 다음 소환 비용 -2
    buffAt: 5, buffMult: 1.3, buffSec: 10,          // 콤보 5: 전체 공격력 +30% 10초
    ultAt: 8,                                       // 콤보 8: 궁극기 1회 사용권(누적 X)
  },
  ult: { name: '세계(광역 폭발)', damage: 350 },     // 방어력 무시
  waves: { count: 5, prepSec: 5, breakSec: 5, hpScalePerWave: 1.0 },   // 적 HP × (1 + 1.0×(웨이브-1)) → W5 = ×5
  stars: { hpFor2: 6, accFor3: 0.8, comboFor3: 5 },  // ★1 클리어, ★2 탑 HP≥6, ★3 정답률≥80% & 최대 콤보≥5
  review: { bonusMana: 3 },                         // 해제 퀴즈 정답 시 다음 판 시작 마나
  cards: {
    wand:     { name:'완드',   el:'불',   icon:'🔥', key:'Q', color:'#ff7a45', shape:'tri',     role:'단일 고화력',
                lv:[ {dmg:24, cd:1.1, range:88}, {dmg:40, cd:1.0, range:96}, {dmg:62, cd:0.9, range:104} ] },
    cup:      { name:'컵',     el:'물',   icon:'💧', key:'W', color:'#4cc9f0', shape:'circle',  role:'둔화',
                lv:[ {dmg:5, cd:0.9, range:82, slow:0.35, slowSec:1.6}, {dmg:8, cd:0.8, range:90, slow:0.45, slowSec:1.8}, {dmg:12, cd:0.7, range:98, slow:0.55, slowSec:2.0} ] },
    sword:    { name:'소드',   el:'바람', icon:'🗡️', key:'E', color:'#8ee3a8', shape:'diamond', role:'연타·2체',
                lv:[ {dmg:7, cd:0.40, range:78, targets:2}, {dmg:11, cd:0.35, range:84, targets:2}, {dmg:15, cd:0.30, range:90, targets:2} ] },
    pentacle: { name:'펜타클', el:'땅',   icon:'🪨', key:'R', color:'#e9c46a', shape:'square',  role:'탑 보호막',
                lv:[ {shieldEvery:12}, {shieldEvery:9}, {shieldEvery:6} ] },
  },
  enemies: {
    normal: { name:'안개 조각',   hp:68,  speed:38, armor:0, dmg:1, r:9,  color:'#a3acd6', shape:'circle' },
    fast:   { name:'속삭임',     hp:40,  speed:70, armor:0, dmg:1, r:7,  color:'#d3a8ff', shape:'tri' },
    tank:   { name:'침묵 덩어리', hp:220, speed:24, armor:3, dmg:2, r:12, color:'#7d8597', shape:'square' },
    boss:   { name:'망각의 왕',   hp:1800, speed:15, armor:5, dmg:5, r:20, color:'#7b3fb0', shape:'boss', slowResist:0.5 },
  },
  // 각 웨이브 = 그룹 배열(그룹은 순서대로 등장, gap = 개체 간격 초)
  waveList: [
    [ {type:'normal', n:8, gap:1.6} ],
    [ {type:'normal', n:8, gap:1.3}, {type:'fast', n:5, gap:0.9} ],
    [ {type:'normal', n:8, gap:1.1}, {type:'tank', n:3, gap:2.5}, {type:'fast', n:6, gap:0.8} ],
    [ {type:'fast', n:8, gap:0.7}, {type:'tank', n:5, gap:2.0}, {type:'normal', n:10, gap:0.9} ],
    [ {type:'normal', n:6, gap:1.0}, {type:'boss', n:1, gap:3.0}, {type:'tank', n:4, gap:2.0}, {type:'fast', n:6, gap:0.7} ],
  ],
};

/* =====================================================================
 * 문제 팩 (수학 연산 30문항). c[0]이 정답, 표시할 때 섞는다. d = 난이도 1~3
 * ===================================================================== */
const QUESTIONS = [
  {id:'m01', d:1, q:'7 + 8 = ?',          c:['15','14','16','13']},
  {id:'m02', d:1, q:'23 + 19 = ?',        c:['42','41','32','43']},
  {id:'m03', d:1, q:'52 − 27 = ?',        c:['25','35','24','29']},
  {id:'m04', d:1, q:'6 × 7 = ?',          c:['42','36','48','49']},
  {id:'m05', d:1, q:'9 × 8 = ?',          c:['72','64','81','63']},
  {id:'m06', d:1, q:'56 ÷ 7 = ?',         c:['8','7','9','6']},
  {id:'m07', d:1, q:'81 ÷ 9 = ?',         c:['9','8','7','11']},
  {id:'m08', d:1, q:'100 − 36 = ?',       c:['64','74','66','54']},
  {id:'m09', d:1, q:'4 × 12 = ?',         c:['48','44','52','36']},
  {id:'m10', d:1, q:'15 + 28 = ?',        c:['43','33','42','53']},
  {id:'m11', d:2, q:'12 × 13 = ?',        c:['156','144','169','132']},
  {id:'m12', d:2, q:'144 ÷ 12 = ?',       c:['12','11','14','13']},
  {id:'m13', d:2, q:'35 × 4 = ?',         c:['140','120','145','135']},
  {id:'m14', d:2, q:'250 − 87 = ?',       c:['163','173','167','153']},
  {id:'m15', d:2, q:'3 × (4 + 5) = ?',    c:['27','17','21','35']},
  {id:'m16', d:2, q:'48 ÷ 6 + 7 = ?',     c:['15','14','13','4']},
  {id:'m17', d:2, q:'18 × 5 = ?',         c:['90','80','95','85']},
  {id:'m18', d:2, q:'7 × 8 − 9 = ?',      c:['47','49','45','56']},
  {id:'m19', d:2, q:'1/2 + 1/4 = ?',      c:['3/4','2/6','1/6','2/4']},
  {id:'m20', d:2, q:'0.5 + 0.25 = ?',     c:['0.75','0.30','0.525','0.7']},
  {id:'m21', d:3, q:'2/3 + 1/6 = ?',      c:['5/6','3/9','1/2','3/6']},
  {id:'m22', d:3, q:'3/4 − 1/3 = ?',      c:['5/12','2/1','1/2','2/12']},
  {id:'m23', d:3, q:'2/5 × 3/4 = ?',      c:['3/10','5/9','6/9','8/15']},
  {id:'m24', d:3, q:'25 × 24 = ?',        c:['600','500','625','480']},
  {id:'m25', d:3, q:'80의 15% = ?',        c:['12','15','8','16']},
  {id:'m26', d:3, q:'3² + 4² = ?',         c:['25','49','14','24']},
  {id:'m27', d:3, q:'(−3) × (−7) = ?',     c:['21','−21','−10','10']},
  {id:'m28', d:3, q:'1.2 × 0.5 = ?',       c:['0.6','6','0.06','1.7']},
  {id:'m29', d:3, q:'3/5 ÷ 3/10 = ?',      c:['2','1/2','9/50','3/2']},
  {id:'m30', d:3, q:'2x + 3 = 11 일 때 x = ?', c:['4','7','5','8']},
];

/* ===================== 맵 정의 (360×380 논리 좌표) ===================== */
const W = 360, H = 380;
const PATH = [[-20,48],[312,48],[312,142],[48,142],[48,236],[312,236],[312,330],[52,330]]; // S자 3굴곡
const TOWER_POS = { x: 32, y: 330 };
const SLOT_R = 19;
const SLOTS = [[92,95],[180,95],[268,95],[110,189],[200,189],[290,189],[140,283],[240,283]].map(([x,y],i)=>({i,x,y}));
const CARD_TYPES = ['wand','cup','sword','pentacle'];
const KEY_TO_CARD = { KeyQ:'wand', KeyW:'cup', KeyE:'sword', KeyR:'pentacle' };

const SEG = []; let PATH_LEN = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const a = PATH[i], b = PATH[i+1], len = Math.hypot(b[0]-a[0], b[1]-a[1]);
  SEG.push({ a, b, len, start: PATH_LEN }); PATH_LEN += len;
}
function posAt(d) {
  if (d <= 0) return { x: PATH[0][0], y: PATH[0][1] };
  for (const s of SEG) if (d <= s.start + s.len) {
    const t = (d - s.start) / s.len;
    return { x: s.a[0] + (s.b[0]-s.a[0]) * t, y: s.a[1] + (s.b[1]-s.a[1]) * t };
  }
  const l = PATH[PATH.length-1]; return { x: l[0], y: l[1] };
}
// 자동 배치 우선순위: 사거리 85 안에 들어오는 경로 길이가 긴 슬롯부터
for (const s of SLOTS) { let c = 0; for (let d = 0; d < PATH_LEN; d += 4) { const p = posAt(d); if (Math.hypot(p.x-s.x, p.y-s.y) <= 85) c += 4; } s.coverage = c; }
const SLOT_PRIORITY = SLOTS.slice().sort((a,b)=>b.coverage-a.coverage).map(s=>s.i);

/* ===================== 유틸 ===================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function shuffle(arr) { for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; }
const _txt = new Map();
function setText(el, v) { v = String(v); if (_txt.get(el) !== v) { _txt.set(el, v); el.textContent = v; } }
function setHTML(el, v) { if (_txt.get(el) !== v) { _txt.set(el, v); el.innerHTML = v; } }

/* ===================== 상태 ===================== */
const SEALED = new Map();   // 세션 동안 유지되는 봉인 목록: id → {item, wrongs, freed, newThisGame}
let pendingBonus = 0;        // 해제 퀴즈로 얻은 다음 판 시작 마나
let S = null;
let nextEnemyId = 1;

function newState(bonus) {
  return {
    phase: 'title', time: 0,
    hp: BALANCE.tower.hp, shield: 0,
    mana: BALANCE.mana.start + bonus, regenT: 0, startBonus: bonus,
    waveIdx: 0, phaseT: BALANCE.waves.prepSec, spawnQ: [], waveT: 0,
    enemies: [], towers: SLOTS.map(()=>null), fx: [],
    combo: 0, maxCombo: 0, discountReady: false, buffT: 0, ultReady: false,
    stats: { answered:0, correct:0, wrong:0, skipped:0, summons:0, upgrades:0, leaked:0, killed:0, ults:0, manaFromQuiz:0, manaFromRegen:0 },
    q: null, qT: 0, lockT: 0, deck: [], lastIdx: -1,
    selCard: null, popupSlot: -1, result: null, reviewDone: false,
  };
}

/* ===================== 웨이브/적 ===================== */
function buildWave(idx) {
  const q = []; let t = 0;
  for (const g of BALANCE.waveList[idx]) { for (let k = 0; k < g.n; k++) { q.push({ t, type: g.type }); t += g.gap; } t += 1.0; }
  return q;
}
function startWave() {
  S.phase = 'wave'; S.waveT = 0; S.spawnQ = buildWave(S.waveIdx);
  banner(S.waveIdx === BALANCE.waves.count-1 ? `웨이브 ${S.waveIdx+1} — 망각의 왕 등장!` : `웨이브 ${S.waveIdx+1} 시작!`);
}
function spawn(type) {
  const b = BALANCE.enemies[type], hp = Math.round(b.hp * (1 + BALANCE.waves.hpScalePerWave * S.waveIdx));
  S.enemies.push({ id: nextEnemyId++, type, hp, maxHp: hp, dist: 0, slowT: 0, slowAmt: 0, hitT: 0, x: PATH[0][0], y: PATH[0][1] });
}
function damage(e, raw, ignoreArmor) {
  const armor = ignoreArmor ? 0 : (BALANCE.enemies[e.type].armor || 0);
  const d = Math.max(1, Math.round(raw - armor));
  e.hp -= d; e.hitT = 0.12;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true; S.stats.killed++;
    S.fx.push({ k:'poof', x:e.x, y:e.y, r:BALANCE.enemies[e.type].r, t:0, life:0.45, color:BALANCE.enemies[e.type].color });
  }
}
function updateEnemies(dt) {
  for (const e of S.enemies) {
    if (e.dead) continue;
    const b = BALANCE.enemies[e.type];
    let sp = b.speed;
    if (e.slowT > 0) { e.slowT -= dt; sp *= 1 - e.slowAmt * (1 - (b.slowResist || 0)); }
    if (e.hitT > 0) e.hitT -= dt;
    e.dist += sp * dt;
    const p = posAt(e.dist); e.x = p.x; e.y = p.y;
    if (e.dist >= PATH_LEN) { e.dead = true; e.leaked = true; towerHit(b.dmg); }
  }
  S.enemies = S.enemies.filter(e => !e.dead);
}
function towerHit(dmg) {
  S.stats.leaked++;
  const absorbed = Math.min(S.shield, dmg); S.shield -= absorbed; dmg -= absorbed;
  if (absorbed) S.fx.push({ k:'text', x:TOWER_POS.x+14, y:TOWER_POS.y-30, s:`🛡️-${absorbed}`, color:'#e9c46a', t:0, life:0.9 });
  if (dmg > 0) {
    S.hp = Math.max(0, S.hp - dmg);
    S.fx.push({ k:'text', x:TOWER_POS.x+14, y:TOWER_POS.y-18, s:`-${dmg}`, color:'#ff5d73', t:0, life:0.9 });
    const box = $('hpBox'); box.classList.remove('hit'); void box.offsetWidth; box.classList.add('hit');
  }
}

/* ===================== 수호자(타워) ===================== */
function towerStats(t) { return BALANCE.cards[t.type].lv[t.lv-1]; }
function summonCost() { return Math.max(0, BALANCE.cost.summon - (S.discountReady ? BALANCE.combo.discountAmount : 0)); }
function upgradeCost(t) { return t.lv >= BALANCE.maxLevel ? Infinity : BALANCE.cost.upgrade[t.lv-1]; }
function canPlay() { return S && (S.phase === 'prep' || S.phase === 'wave'); }

function summon(slot, type) {
  if (!canPlay() || S.towers[slot]) return false;
  const cost = summonCost();
  if (S.mana < cost) { flashFeedback(`마나 부족 (${cost} 필요)`, 'bad'); return false; }
  S.mana -= cost; if (S.discountReady) S.discountReady = false;
  const st = BALANCE.cards[type].lv[0];
  S.towers[slot] = { type, lv: 1, cd: type === 'pentacle' ? st.shieldEvery : 0, aim: 0 };
  S.stats.summons++;
  const s = SLOTS[slot];
  S.fx.push({ k:'ring', x:s.x, y:s.y, r:SLOT_R, t:0, life:0.4, color:BALANCE.cards[type].color });
  return true;
}
function upgrade(slot) {
  const t = S.towers[slot]; if (!canPlay() || !t) return false;
  const cost = upgradeCost(t);
  if (cost === Infinity) return false;
  if (S.mana < cost) { flashFeedback(`마나 부족 (${cost} 필요)`, 'bad'); return false; }
  S.mana -= cost; t.lv++; S.stats.upgrades++;
  const s = SLOTS[slot];
  S.fx.push({ k:'ring', x:s.x, y:s.y, r:SLOT_R+6, t:0, life:0.5, color:'#ffd166' });
  return true;
}
function updateTowers(dt) {
  const mult = S.buffT > 0 ? BALANCE.combo.buffMult : 1;
  S.towers.forEach((t, i) => {
    if (!t) return;
    const s = SLOTS[i], L = towerStats(t);
    t.cd -= dt;
    if (t.type === 'pentacle') {
      if (t.cd <= 0) {
        t.cd = L.shieldEvery;
        if (S.shield < BALANCE.tower.shieldCap) {
          S.shield++;
          S.fx.push({ k:'beam', x1:s.x, y1:s.y, x2:TOWER_POS.x, y2:TOWER_POS.y, color:'#e9c46a', t:0, life:0.35, w:2 });
        }
      }
      return;
    }
    if (t.cd > 0) return;
    const inRange = S.enemies.filter(e => !e.dead && Math.hypot(e.x-s.x, e.y-s.y) <= L.range).sort((a,b)=>b.dist-a.dist);
    if (!inRange.length) return;
    t.cd = L.cd;
    const n = L.targets || 1, col = BALANCE.cards[t.type].color;
    for (let k = 0; k < Math.min(n, inRange.length); k++) {
      const e = inRange[k];
      t.aim = Math.atan2(e.y-s.y, e.x-s.x);
      damage(e, L.dmg * mult);
      if (L.slow) { e.slowAmt = e.slowT > 0 ? Math.max(e.slowAmt, L.slow) : L.slow; e.slowT = Math.max(e.slowT, L.slowSec); }
      S.fx.push({ k:'beam', x1:s.x, y1:s.y, x2:e.x, y2:e.y, color:col, t:0, life: t.type==='wand'?0.18:0.1, w: t.type==='wand'?4:2 });
      if (t.type === 'wand') S.fx.push({ k:'ring', x:e.x, y:e.y, r:6, t:0, life:0.25, color:col });
    }
  });
}
function useUlt() {
  if (!canPlay() || !S.ultReady) return false;
  S.ultReady = false; S.stats.ults++;
  for (const e of S.enemies) damage(e, BALANCE.ult.damage, true);
  S.fx.push({ k:'nova', x:W/2, y:H/2, t:0, life:0.7 });
  banner(`💥 메이저 아르카나 — ${BALANCE.ult.name}!`);
  return true;
}

/* ===================== 문제/마나/콤보 ===================== */
function addMana(n, fromQuiz) {
  const before = S.mana; S.mana = Math.min(BALANCE.mana.max, S.mana + n);
  if (fromQuiz) S.stats.manaFromQuiz += S.mana - before; else S.stats.manaFromRegen += S.mana - before;
}
function nextQuestion() {
  if (!S.deck.length) { S.deck = shuffle(QUESTIONS.map((_,i)=>i)); if (S.deck[S.deck.length-1] === S.lastIdx) S.deck.unshift(S.deck.pop()); }
  const idx = S.deck.pop(); S.lastIdx = idx;
  const item = QUESTIONS[idx], order = shuffle([0,1,2,3]);
  S.q = { idx, item, opts: order.map(k => item.c[k]), correct: order.indexOf(0), picked: -1 };
  S.qT = 0; S.lockT = 0;
  renderQuestion();
}
function answer(i) {
  if (!canPlay() || !S.q || S.lockT > 0) return null;
  const q = S.q, ok = i === q.correct; q.picked = i;
  S.stats.answered++;
  if (ok) {
    const gain = BALANCE.mana.byDifficulty[q.item.d];
    S.stats.correct++; addMana(gain, true);
    S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    flashFeedback(`정답! +${gain} 마나`, 'good');
    comboReward();
    S.lockT = BALANCE.quiz.correctDelay;
  } else {
    S.stats.wrong++;
    if (S.combo >= 3) flashFeedback(`오답 — 콤보 ${S.combo} 끊김, 봉인 등록 🔒`, 'bad'); else flashFeedback('오답 — 봉인 카드에 등록 🔒', 'bad');
    S.combo = 0;
    const sealed = SEALED.get(q.item.id);
    if (sealed) { sealed.wrongs++; sealed.freed = false; sealed.newThisGame = true; }
    else SEALED.set(q.item.id, { item: q.item, wrongs: 1, freed: false, newThisGame: true });
    S.lockT = BALANCE.quiz.wrongLockSec;
  }
  renderQuestion();
  return ok;
}
function comboReward() {
  const C = BALANCE.combo, c = ((S.combo - 1) % C.cycle) + 1;
  if (c === C.discountAt) { S.discountReady = true; banner(`콤보 ${S.combo}! 다음 소환 비용 -${C.discountAmount}`); }
  if (c === C.buffAt) { S.buffT = C.buffSec; banner(`콤보 ${S.combo}! 전체 공격력 +${Math.round((C.buffMult-1)*100)}% (${C.buffSec}초)`); }
  if (c === C.ultAt) { S.ultReady = true; banner(`콤보 ${S.combo}! 궁극기 준비 — Space`); }
}
function updateQuiz(dt) {
  if (!S.q) return;
  if (S.lockT > 0) { S.lockT -= dt; if (S.lockT <= 0) nextQuestion(); return; }
  S.qT += dt;
  if (S.qT >= BALANCE.quiz.idleSkipSec) {
    S.stats.skipped++;
    flashFeedback('⏭ 10초 방치 — 문제 교체(회피)', 'skip');
    nextQuestion();
  }
}

/* ===================== 게임 흐름 ===================== */
function startGame() {
  const bonus = pendingBonus; pendingBonus = 0;
  for (const v of SEALED.values()) v.newThisGame = false;
  S = newState(bonus);
  S.phase = 'prep'; S.phaseT = BALANCE.waves.prepSec;
  $('overlay').hidden = true; closePopup();
  nextQuestion();
  banner(bonus ? `준비! 해제 퀴즈 보너스 +${bonus} 마나` : '준비! 문제를 풀어 마나를 모으세요');
}
function update(dt) {
  if (!S) return;
  updateFx(dt);
  if (!canPlay()) return;
  S.time += dt;
  S.regenT += dt;
  while (S.regenT >= BALANCE.mana.regenEvery) { S.regenT -= BALANCE.mana.regenEvery; addMana(BALANCE.mana.regenAmount, false); }
  if (S.buffT > 0) S.buffT = Math.max(0, S.buffT - dt);
  updateQuiz(dt);
  if (S.phase === 'prep') {
    S.phaseT -= dt; if (S.phaseT <= 0) startWave();
  } else if (S.phase === 'wave') {
    S.waveT += dt;
    while (S.spawnQ.length && S.spawnQ[0].t <= S.waveT) spawn(S.spawnQ.shift().type);
  }
  updateEnemies(dt);
  updateTowers(dt);
  S.enemies = S.enemies.filter(e => !e.dead);
  if (S.hp <= 0) { endGame(false); return; }
  if (S.phase === 'wave' && !S.spawnQ.length && !S.enemies.length) {
    if (S.waveIdx >= BALANCE.waves.count - 1) endGame(true);
    else { S.waveIdx++; S.phase = 'prep'; S.phaseT = BALANCE.waves.breakSec; banner(`웨이브 ${S.waveIdx} 방어 성공! 5초 휴식`); }
  }
}
function updateFx(dt) { for (const f of S.fx) f.t += dt; S.fx = S.fx.filter(f => f.t < f.life); }

function endGame(win) {
  if (S.phase === 'result') return;
  S.phase = 'result'; closePopup();
  const st = S.stats, B = BALANCE.stars;
  const denom = st.answered + st.skipped, acc = denom ? st.correct / denom : 0;
  const crit = [
    { ok: win, label: '탑을 지켜냈다 (클리어)' },
    { ok: win && S.hp >= B.hpFor2, label: `탑 HP ${S.hp}/${BALANCE.tower.hp} (≥ ${B.hpFor2})` },
    { ok: win && acc >= B.accFor3 && S.maxCombo >= B.comboFor3, label: `정답률 ${Math.round(acc*100)}% (≥ ${B.accFor3*100}%) & 최대 콤보 ${S.maxCombo} (≥ ${B.comboFor3})` },
  ];
  let stars = 0; if (crit[0].ok) { stars = 1; if (crit[1].ok) stars++; if (crit[2].ok) stars++; }
  S.result = { win, stars, acc, crit, wave: S.waveIdx + 1, time: S.time };
  renderResult();
}

/* ===================== 렌더링: 캔버스 ===================== */
const cv = $('map'), ctx = cv.getContext('2d');
let VIEW = { scale: 1, dpr: 1 };
function resize() {
  const st = $('stage'), aw = st.clientWidth, ah = st.clientHeight;
  const scale = Math.max(0.3, Math.min(aw / W, ah / H));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  VIEW = { scale, dpr };
}
const DECOR = (() => { const a = []; let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; for (let i = 0; i < 70; i++) a.push([r()*W, r()*H, 1 + r()*2]); return a; })();

function shapePath(shape, x, y, r) {
  ctx.beginPath();
  if (shape === 'circle') ctx.arc(x, y, r, 0, Math.PI*2);
  else if (shape === 'tri') { ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.95, y+r*0.75); ctx.lineTo(x-r*0.95, y+r*0.75); ctx.closePath(); }
  else if (shape === 'diamond') { ctx.moveTo(x, y-r); ctx.lineTo(x+r, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r, y); ctx.closePath(); }
  else if (shape === 'square') { ctx.rect(x-r*0.82, y-r*0.82, r*1.64, r*1.64); }
  else if (shape === 'boss') { for (let k = 0; k < 8; k++) { const a = k * Math.PI/4, rr = k % 2 ? r*0.78 : r; ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); } ctx.closePath(); }
}
function render() {
  if (!S) return;
  const k = VIEW.scale * VIEW.dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  // 배경
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1e3a3a'); g.addColorStop(1, '#173126');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff10'; for (const [x,y,r] of DECOR) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  // 길
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#0f1f1b'; ctx.lineWidth = 34; strokePath();
  ctx.strokeStyle = '#4a4378'; ctx.lineWidth = 28; strokePath();
  ctx.strokeStyle = '#6b62a855'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]); strokePath(); ctx.setLineDash([]);
  // 안개 입구
  const tt = performance.now() / 1000;
  for (let i = 0; i < 3; i++) { ctx.fillStyle = `rgba(200,190,255,${0.12 + 0.05*Math.sin(tt*2+i)})`; ctx.beginPath(); ctx.arc(4, 48, 18 + i*6, 0, 7); ctx.fill(); }
  // 탑
  drawTower();
  // 사거리 표시
  const showSlot = S.popupSlot >= 0 ? S.popupSlot : -1;
  if (showSlot >= 0 && S.towers[showSlot] && S.towers[showSlot].type !== 'pentacle') {
    const s = SLOTS[showSlot], L = towerStats(S.towers[showSlot]);
    ctx.fillStyle = '#ffffff12'; ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, L.range, 0, 7); ctx.fill(); ctx.stroke();
  }
  // 슬롯
  SLOTS.forEach((s, i) => {
    const t = S.towers[i];
    if (!t) {
      const hl = (S.selCard && canPlay()) || i === S.popupSlot;
      ctx.setLineDash([4, 4]); ctx.lineWidth = hl ? 2.5 : 1.5;
      ctx.strokeStyle = hl ? '#ffd166' : '#ffffff66'; ctx.fillStyle = '#00000033';
      ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = hl ? '#ffd166' : '#ffffff88'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', s.x, s.y + 1);
      ctx.font = '9px sans-serif'; ctx.fillStyle = '#ffffff66'; ctx.fillText(String(i+1), s.x + SLOT_R - 2, s.y - SLOT_R + 3);
    } else {
      const c = BALANCE.cards[t.type];
      ctx.fillStyle = '#0d0b1e'; ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R, 0, 7); ctx.fill();
      shapePath(c.shape, s.x, s.y, SLOT_R - 2); ctx.fillStyle = c.color + 'cc'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = i === S.popupSlot ? '#fff' : '#0008'; ctx.stroke();
      ctx.font = '15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(c.icon, s.x, s.y + 1);
      for (let l = 0; l < t.lv; l++) { ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(s.x - 7 + l*7, s.y + SLOT_R + 4, 2.6, 0, 7); ctx.fill(); }
      if (canPlay() && upgradeCost(t) <= S.mana) { ctx.fillStyle = '#ffd166'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('▲', s.x + SLOT_R - 2, s.y - SLOT_R + 2); }
    }
  });
  // 적
  for (const e of S.enemies) {
    const b = BALANCE.enemies[e.type];
    shapePath(b.shape, e.x, e.y, b.r);
    ctx.fillStyle = e.hitT > 0 ? '#ffffff' : b.color; ctx.fill();
    ctx.lineWidth = e.slowT > 0 ? 3 : 1.5; ctx.strokeStyle = e.slowT > 0 ? '#4cc9f0' : '#0009'; ctx.stroke();
    if (e.type === 'boss') { ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👑', e.x, e.y - b.r - 10); }
    const w = b.r * 2 + 4, f = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = '#000a'; ctx.fillRect(e.x - w/2, e.y - b.r - 6, w, 3);
    ctx.fillStyle = f > 0.5 ? '#38d996' : f > 0.25 ? '#ffd166' : '#ff5d73'; ctx.fillRect(e.x - w/2, e.y - b.r - 6, w * f, 3);
  }
  // 효과
  for (const f of S.fx) {
    const p = f.t / f.life, a = 1 - p;
    ctx.globalAlpha = a;
    if (f.k === 'beam') { ctx.strokeStyle = f.color; ctx.lineWidth = f.w; ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke(); }
    else if (f.k === 'ring') { ctx.strokeStyle = f.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + p*10, 0, 7); ctx.stroke(); }
    else if (f.k === 'poof') { ctx.fillStyle = f.color; for (let i = 0; i < 6; i++) { const ang = i * Math.PI/3; ctx.beginPath(); ctx.arc(f.x + Math.cos(ang)*p*f.r*2, f.y + Math.sin(ang)*p*f.r*2, f.r*0.35*(1-p)+1, 0, 7); ctx.fill(); } }
    else if (f.k === 'nova') { ctx.fillStyle = '#ff4d8d55'; ctx.beginPath(); ctx.arc(f.x, f.y, p * 300, 0, 7); ctx.fill(); ctx.strokeStyle = '#ffb3cd'; ctx.lineWidth = 6*(1-p); ctx.stroke(); }
    else if (f.k === 'text') { ctx.fillStyle = f.color; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(f.s, f.x, f.y - p*14); }
    ctx.globalAlpha = 1;
  }
  // 버프 테두리
  if (S.buffT > 0) { ctx.strokeStyle = '#9d4eddaa'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, W-4, H-4); }
  // 휴식 카운트다운
  if (S.phase === 'prep') {
    ctx.fillStyle = '#000a'; ctx.fillRect(W/2 - 110, H/2 - 30, 220, 56);
    ctx.fillStyle = '#ffd166'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px sans-serif'; ctx.fillText(`웨이브 ${S.waveIdx+1}/${BALANCE.waves.count} 시작까지`, W/2, H/2 - 12);
    ctx.font = 'bold 22px sans-serif'; ctx.fillText(`${Math.ceil(Math.max(0, S.phaseT))}`, W/2, H/2 + 12);
  }
}
function strokePath() { ctx.beginPath(); ctx.moveTo(PATH[0][0], PATH[0][1]); for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i][0], PATH[i][1]); ctx.stroke(); }
function drawTower() {
  const { x, y } = TOWER_POS;
  if (S.shield > 0) { ctx.strokeStyle = '#e9c46a'; ctx.lineWidth = 2 + S.shield; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(x, y - 4, 26, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
  ctx.fillStyle = '#d9d2ff'; ctx.fillRect(x - 13, y - 18, 26, 30);
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(x - 16, y - 18); ctx.lineTo(x, y - 36); ctx.lineTo(x + 16, y - 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3d3780'; ctx.fillRect(x - 4, y, 8, 12);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#17143a'; ctx.fillText(`${S.hp}`, x, y - 8);
}

/* ===================== 렌더링: DOM ===================== */
function buildStaticUI() {
  const pips = $('pips');
  for (let i = 1; i <= BALANCE.combo.cycle; i++) {
    const sp = document.createElement('span');
    if ([BALANCE.combo.discountAt, BALANCE.combo.buffAt, BALANCE.combo.ultAt].includes(i)) { sp.className = 'mark'; sp.dataset.m = i; }
    pips.appendChild(sp);
  }
  const ch = $('choices');
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button'); b.className = 'ch'; b.dataset.i = i;
    b.innerHTML = `<span class="k">${i+1}</span><span class="v"></span>`;
    b.addEventListener('click', () => { answer(i); b.blur(); });
    ch.appendChild(b);
  }
  const bar = $('cardbar');
  for (const type of CARD_TYPES) {
    const c = BALANCE.cards[type], b = document.createElement('button');
    b.className = 'card'; b.dataset.type = type; b.style.setProperty('--c', c.color);
    b.title = `${c.name}(${c.el}) — ${c.role}`;
    b.innerHTML = `<span class="k">${c.key}</span><span class="ic">${c.icon}</span>${c.name}<br><span class="cost">5💎</span>`;
    b.addEventListener('click', () => { pickCard(type); b.blur(); });
    bar.appendChild(b);
  }
  const u = document.createElement('button'); u.id = 'ultBtn'; u.disabled = true;
  u.innerHTML = `<span class="ic">💥</span>궁극기<br><small>Space</small>`;
  u.addEventListener('click', () => { useUlt(); u.blur(); });
  bar.appendChild(u);
}
function renderQuestion() {
  const q = S.q; if (!q) return;
  const dl = ['', '쉬움', '보통', '어려움'][q.item.d];
  setText($('qDiff'), `${'★'.repeat(q.item.d)}${'☆'.repeat(3-q.item.d)} ${dl} · 정답 +${BALANCE.mana.byDifficulty[q.item.d]}💎`);
  setText($('qText'), q.item.q);
  [...$('choices').children].forEach((b, i) => {
    setText(b.querySelector('.v'), q.opts[i]);
    b.classList.toggle('correct', S.lockT > 0 && i === q.correct);
    b.classList.toggle('wrong', S.lockT > 0 && i === q.picked && i !== q.correct);
  });
  $('quiz').classList.toggle('locked', S.lockT > 0);
}
let fbTimer = 0;
function flashFeedback(msg, cls) {
  const el = $('qFeedback'); el.textContent = msg; el.className = cls; _txt.delete(el);
  clearTimeout(fbTimer); fbTimer = setTimeout(() => { el.textContent = ''; }, 1800);
}
let bannerTimer = 0;
function banner(msg) {
  const el = $('banner'); el.textContent = msg; el.classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => el.classList.remove('show'), 1600);
}
function syncHUD() {
  if (!S) return;
  setText($('hpTxt'), S.hp); setText($('hpMax'), `/${BALANCE.tower.hp}`);
  setText($('shieldTxt'), S.shield ? `🛡️${S.shield}` : '');
  $('hpBar').style.width = (S.hp / BALANCE.tower.hp * 100) + '%';
  $('hpBox').classList.toggle('low', S.hp <= 3);
  setText($('manaTxt'), S.mana);
  $('manaBar').style.width = (S.regenT / BALANCE.mana.regenEvery * 100) + '%';
  setText($('waveTxt'), `${Math.min(S.waveIdx+1, BALANCE.waves.count)}/${BALANCE.waves.count}`);
  setText($('phaseTxt'), S.phase === 'prep' ? `휴식 ${Math.ceil(S.phaseT)}s` : S.phase === 'wave' ? `적 ${S.enemies.length + S.spawnQ.length}` : '');
  setText($('comboTxt'), S.combo);
  const cpos = S.combo === 0 ? 0 : ((S.combo - 1) % BALANCE.combo.cycle) + 1;
  [...$('pips').children].forEach((p, i) => p.classList.toggle('on', i < cpos));
  let bd = '';
  if (S.discountReady) bd += `<span class="badge disc">소환 -${BALANCE.combo.discountAmount}</span>`;
  if (S.buffT > 0) bd += `<span class="badge buff">⚔️+${Math.round((BALANCE.combo.buffMult-1)*100)}% ${Math.ceil(S.buffT)}s</span>`;
  if (S.ultReady) bd += `<span class="badge ult">💥</span>`;
  setHTML($('badges'), bd);
  // 문제 방치
  const idleOn = canPlay() && S.lockT <= 0;
  $('idleBar').style.width = (idleOn ? clamp(S.qT / BALANCE.quiz.idleSkipSec, 0, 1) * 100 : 0) + '%';
  $('quiz').classList.toggle('warn', idleOn && S.qT >= BALANCE.quiz.idleWarnSec);
  $('quiz').classList.toggle('locked', S.lockT > 0);
  if (S.lockT <= 0) [...$('choices').children].forEach(b => { b.classList.remove('correct', 'wrong'); });
  // 카드 바
  const cost = summonCost();
  [...$('cardbar').querySelectorAll('.card')].forEach(b => {
    setHTML(b.querySelector('.cost'), S.discountReady ? `<s style="opacity:.6">${BALANCE.cost.summon}</s> ${cost}💎` : `${cost}💎`);
    b.classList.toggle('sel', S.selCard === b.dataset.type);
    b.classList.toggle('poor', S.mana < cost);
  });
  const u = $('ultBtn'); u.disabled = !(S.ultReady && canPlay()); u.classList.toggle('ready', S.ultReady && canPlay());
  if (S.popupSlot >= 0) refreshPopupState();
}

/* ===================== 팝업 (슬롯 → 소환/강화) ===================== */
function slotToStage(i) {
  const s = SLOTS[i], cr = cv.getBoundingClientRect(), sr = $('stage').getBoundingClientRect();
  return { x: cr.left - sr.left + s.x * cr.width / W, y: cr.top - sr.top + s.y * cr.height / H, r: SLOT_R * cr.width / W };
}
function openPopup(i) {
  S.popupSlot = i;
  const pop = $('popup'), t = S.towers[i];
  if (!t) {
    pop.innerHTML = `<div class="ptitle"><span>슬롯 ${i+1} · 소환</span><button data-x>✕</button></div><div class="pgrid">` +
      CARD_TYPES.map(type => { const c = BALANCE.cards[type];
        return `<button class="pbtn" data-sum="${type}" style="--c:${c.color}"><span class="ic">${c.icon}</span><b>${c.name}</b> <span class="pc"></span><small>${c.key} · ${c.el} · ${c.role}</small></button>`; }).join('') + `</div>`;
  } else {
    const c = BALANCE.cards[t.type];
    pop.innerHTML = `<div class="ptitle"><span>${c.icon} ${c.name} Lv${t.lv}</span><button data-x>✕</button></div>
      <div class="pinfo">${describe(t.type, t.lv)}${t.lv < BALANCE.maxLevel ? `<br>▶ Lv${t.lv+1}: ${describe(t.type, t.lv+1)}` : '<br>최대 레벨'}</div>
      <button class="upbtn" data-up>${t.lv < BALANCE.maxLevel ? `⬆ 강화 ${upgradeCost(t)}💎` : '최대 레벨'}</button>`;
  }
  pop.hidden = false;
  const p = slotToStage(i), st = $('stage'), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = clamp(p.x - pw/2, 4, st.clientWidth - pw - 4);
  let top = p.y + p.r + 6; if (top + ph > st.clientHeight - 4) top = p.y - p.r - ph - 6;
  pop.style.left = left + 'px'; pop.style.top = clamp(top, 4, st.clientHeight - ph - 4) + 'px';
  refreshPopupState();
}
function describe(type, lv) {
  const L = BALANCE.cards[type].lv[lv-1];
  if (type === 'pentacle') return `보호막 +1 / <b>${L.shieldEvery}초</b> (최대 ${BALANCE.tower.shieldCap})`;
  let s = `피해 <b>${L.dmg}</b> · ${L.cd}초 · 사거리 ${L.range}`;
  if (L.targets) s += ` · <b>${L.targets}체</b>`;
  if (L.slow) s += ` · 둔화 <b>${Math.round(L.slow*100)}%</b> ${L.slowSec}초`;
  return s;
}
function refreshPopupState() {
  const pop = $('popup'); if (pop.hidden) return;
  const t = S.towers[S.popupSlot];
  if (!t) {
    const cost = summonCost();
    pop.querySelectorAll('[data-sum]').forEach(b => { b.disabled = S.mana < cost || !canPlay(); setText(b.querySelector('.pc'), `${cost}💎`); });
  } else {
    const ub = pop.querySelector('[data-up]'); if (ub) ub.disabled = !canPlay() || S.mana < upgradeCost(t);
  }
}
function closePopup() { if (S) S.popupSlot = -1; $('popup').hidden = true; }
$('popup').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-x')) { closePopup(); return; }
  if (b.dataset.sum) { if (summon(S.popupSlot, b.dataset.sum)) closePopup(); return; }
  if (b.hasAttribute('data-up')) { const i = S.popupSlot; if (upgrade(i)) openPopup(i); }
});
function onSlotTap(i) {
  if (!canPlay()) return;
  if (S.popupSlot === i) { closePopup(); return; }
  if (!S.towers[i] && S.selCard) { summon(i, S.selCard); closePopup(); return; }
  openPopup(i);
}
function pickCard(type) {
  if (!canPlay()) return;
  if (S.popupSlot >= 0 && !S.towers[S.popupSlot]) { if (summon(S.popupSlot, type)) closePopup(); return; }
  if (S.selCard === type) {
    const slot = SLOT_PRIORITY.find(i => !S.towers[i]);
    if (slot === undefined) { flashFeedback('빈 슬롯이 없습니다', 'bad'); return; }
    if (summon(slot, type)) { S.selCard = null; }
    return;
  }
  S.selCard = type;
  flashFeedback(`${BALANCE.cards[type].icon} 선택 — 빈 슬롯 탭 / ${BALANCE.cards[type].key} 한 번 더 = 자동 배치`, 'skip');
}
cv.addEventListener('click', ev => {
  if (!canPlay()) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W, y = (ev.clientY - r.top) / r.height * H;
  const hit = SLOTS.find(s => Math.hypot(s.x - x, s.y - y) <= SLOT_R + 6);
  if (hit) onSlotTap(hit.i); else { closePopup(); S.selCard = null; }
});

/* ===================== 결과 / 타이틀 ===================== */
function renderTitle() {
  const C = BALANCE.combo;
  $('overlay').innerHTML = `<div class="panel">
    <h1>🃏 아르카나 수비대</h1>
    <p style="text-align:center">문제를 풀어 <b>마나</b>를 모으고, 아르카나 카드를 소환해<br>망각의 안개로부터 <b>지식의 탑</b>을 지키세요.</p>
    <h2>카드 (소환 ${BALANCE.cost.summon}💎 · 강화 ${BALANCE.cost.upgrade.slice(0, BALANCE.maxLevel-1).join('/')}💎)</h2>
    <ul>${CARD_TYPES.map(t => { const c = BALANCE.cards[t]; return `<li>${c.icon} <b>${c.name}</b>(${c.el}, ${c.key}) — ${c.role}</li>`; }).join('')}</ul>
    <h2>콤보</h2>
    <ul><li>${C.discountAt}콤보: 다음 소환 -${C.discountAmount}💎</li><li>${C.buffAt}콤보: 전체 공격력 +${Math.round((C.buffMult-1)*100)}% ${C.buffSec}초</li><li>${C.ultAt}콤보: 💥 궁극기(광역 폭발) 1회</li></ul>
    <h2>조작</h2>
    <ul><li>1~4: 답 선택 · Q/W/E/R: 카드 선택(한 번 더 누르면 자동 배치) · Space: 궁극기</li>
    <li>빈 슬롯 탭 → 속성 선택 → 소환 · 소환된 슬롯 탭 → 강화</li>
    <li>문제를 ${BALANCE.quiz.idleSkipSec}초 방치하면 자동 교체(회피 기록)</li></ul>
    ${pendingBonus ? `<p style="color:var(--good)">해제 퀴즈 보너스: 시작 마나 +${pendingBonus}</p>` : ''}
    <button class="big" id="startBtn">시작하기 (Enter)</button></div>`;
  $('overlay').hidden = false;
  $('startBtn').addEventListener('click', startGame);
}
function renderResult() {
  const R = S.result, st = S.stats;
  const sealedList = [...SEALED.values()];
  const starHtml = [0,1,2].map(i => i < R.stars ? '★' : '<span class="off">★</span>').join('');
  $('overlay').innerHTML = `<div class="panel">
    <h1>${R.win ? '🏰 탑을 지켰다!' : '🌫️ 탑 함락…'}</h1>
    <div class="stars">${starHtml}</div>
    <div class="crit">${R.crit.map(c => `<div class="${c.ok ? 'ok' : 'no'}">${c.ok ? '✔' : '✘'} ${c.label}</div>`).join('')}</div>
    <h2>기록</h2>
    <div class="stats grid2">
      <div>도달 웨이브 ${R.win ? BALANCE.waves.count : R.wave}/${BALANCE.waves.count}</div><div>플레이 ${Math.round(R.time)}초</div>
      <div>정답 ${st.correct}/${st.answered} (회피 ${st.skipped})</div><div>정답률 ${Math.round(R.acc*100)}%</div>
      <div>최대 콤보 ${S.maxCombo}</div><div>궁극기 ${st.ults}회</div>
      <div>소환 ${st.summons} · 강화 ${st.upgrades}</div><div>마나 문제 ${st.manaFromQuiz} / 회복 ${st.manaFromRegen}</div>
    </div>
    <h2>🔒 봉인 카드 (${sealedList.filter(s => !s.freed).length})</h2>
    <div class="sealed" id="sealedList">${sealedList.length ? sealedList.map(s =>
      `<button data-id="${s.item.id}" class="${s.freed ? 'freed' : ''} ${s.newThisGame && !s.freed ? 'new' : ''}" ${s.freed || S.reviewDone ? 'disabled' : ''}>🔒 ${s.item.q} <small style="color:var(--mut)">· 오답 ${s.wrongs}회</small></button>`).join('')
      : '<p>봉인된 카드가 없습니다. 완벽해요!</p>'}</div>
    <div id="review"></div>
    ${sealedList.some(s => !s.freed) && !S.reviewDone ? `<button class="sec" id="reviewBtn">🔓 해제 퀴즈 (1문제 · 정답 시 다음 판 +${BALANCE.review.bonusMana}💎)</button>` : ''}
    <button class="big" id="retryBtn">다시하기 (Enter)</button></div>`;
  $('overlay').hidden = false;
  $('retryBtn').addEventListener('click', startGame);
  const rb = $('reviewBtn');
  if (rb) rb.addEventListener('click', () => { const open = sealedList.filter(s => !s.freed); startReview(open[Math.floor(Math.random()*open.length)].item.id); });
  $('sealedList').addEventListener('click', ev => { const b = ev.target.closest('button[data-id]'); if (b && !b.disabled) startReview(b.dataset.id); });
}
function startReview(id) {
  if (S.reviewDone) return;
  const s = SEALED.get(id); if (!s || s.freed) return;
  S.reviewDone = true;
  const rbtn = $('reviewBtn'); if (rbtn) rbtn.remove();
  $('sealedList').querySelectorAll('button').forEach(b => b.disabled = true);
  const order = shuffle([0,1,2,3]), correct = order.indexOf(0);
  S.review = { id, correct, answered: false };
  $('review').innerHTML = `<h2>🔓 해제 퀴즈</h2><div class="rq">${s.item.q}</div>
    <div class="grid2">${order.map((k, i) => `<button class="ch" data-r="${i}"><span class="k">${i+1}</span>${s.item.c[k]}</button>`).join('')}</div><div class="rmsg" id="rmsg"></div>`;
  $('review').querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => reviewAnswer(+b.dataset.r)));
}
function reviewAnswer(i) {
  const R = S.review; if (!R || R.answered) return; R.answered = true;
  const s = SEALED.get(R.id), btns = $('review').querySelectorAll('[data-r]');
  btns.forEach((b, k) => { b.disabled = true; if (k === R.correct) b.classList.add('correct'); else if (k === i) b.classList.add('wrong'); });
  if (i === R.correct) {
    s.freed = true; pendingBonus += BALANCE.review.bonusMana;
    $('rmsg').innerHTML = `<span style="color:var(--good)">봉인 해제! 다음 판 시작 마나 +${BALANCE.review.bonusMana}</span>`;
    const lb = $('sealedList').querySelector(`[data-id="${R.id}"]`); if (lb) { lb.classList.add('freed'); lb.classList.remove('new'); }
  } else {
    s.wrongs++;
    $('rmsg').innerHTML = `<span style="color:var(--bad)">아쉬워요. 정답은 <b>${s.item.c[0]}</b> — 봉인 유지</span>`;
  }
}

/* ===================== 입력 ===================== */
document.addEventListener('keydown', ev => {
  if (ev.code === 'Space') ev.preventDefault();
  if (ev.repeat) return;
  const ov = !$('overlay').hidden;
  if (ov) {
    if (S && S.review && !S.review.answered && /^(Digit|Numpad)[1-4]$/.test(ev.code)) { reviewAnswer(+ev.code.slice(-1) - 1); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter') { ev.preventDefault(); startGame(); }
    return;
  }
  const m = /^(Digit|Numpad)([1-4])$/.exec(ev.code);
  if (m) { answer(+m[2] - 1); return; }
  if (KEY_TO_CARD[ev.code]) { pickCard(KEY_TO_CARD[ev.code]); return; }
  if (ev.code === 'Space') { useUlt(); return; }
  if (ev.code === 'Escape') { closePopup(); if (S) S.selCard = null; }
});
document.addEventListener('keyup', ev => { if (ev.code === 'Space') ev.preventDefault(); });
window.addEventListener('resize', () => { resize(); if (S && S.popupSlot >= 0) openPopup(S.popupSlot); });

/* ===================== 메인 루프 ===================== */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  update(dt); render(); syncHUD();
  requestAnimationFrame(frame);
}

buildStaticUI();
S = newState(0);
resize();
renderTitle();
requestAnimationFrame(frame);

/* 테스트/밸런싱용 디버그 훅 (게임 플레이에는 영향 없음) */
window.__arcana = {
  get state() { return S; }, BALANCE, QUESTIONS, SLOTS, PATH_LEN, SLOT_PRIORITY,
  start: startGame, answer, summon, upgrade, useUlt,
  answerCorrect() { return S.q ? answer(S.q.correct) : null; },
  answerWrong() { return S.q ? answer((S.q.correct + 1) % 4) : null; },
  step(sec, dt = 1/30, draw = true) { let n = Math.round(sec / dt); while (n-- > 0) update(dt); if (draw) { render(); syncHUD(); } },
  slotClientPos(i) { const r = cv.getBoundingClientRect(), s = SLOTS[i]; return { x: r.left + s.x * r.width / W, y: r.top + s.y * r.height / H }; },
};
</script>
