<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>아르카나 3D 수학 실험실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23221e4a'/%3E%3Cpath d='M24 7 41 39H7Z' fill='%23ffd166'/%3E%3C/svg%3E">
<style>
:root{--bg:#17143a;--panel:#221e4a;--panel2:#2d2860;--line:#3d3780;--ink:#f5f2ff;--mut:#aaa4d6;--gold:#ffd166;--good:#38d996;--bad:#ff5d73;--info:#7cc7ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0a1f;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
@media (min-height:760px){body{align-items:center}}
#app{position:relative;width:100%;max-width:360px;height:100vh;max-height:740px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (min-width:420px){#app{border-radius:14px;box-shadow:0 0 0 1px #2f2a66,0 20px 60px #0008}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.run-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:12px;color:var(--mut)}
.run-nav a,.run-nav button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font:inherit;text-decoration:none}
.run-nav button:disabled{opacity:.45;cursor:default}
a.sec{text-align:center;color:var(--ink);text-decoration:none}
#pauseLayer{position:absolute;inset:0;z-index:20;background:#0c0a1fe8;display:flex;align-items:center;justify-content:center;padding:18px}
#pauseLayer h2{color:var(--ink);font-size:23px;text-align:center;margin:0 0 10px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#hud{padding:6px 8px 4px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:2}
.hrow{display:flex;gap:6px;align-items:center}
.stat{flex:1;min-width:0;background:var(--panel2);border-radius:8px;padding:3px 6px;font-size:13px;line-height:1.25;white-space:nowrap}
.stat b{font-size:15px}.stat small{color:var(--mut);font-size:11px;margin-left:3px}
.bar{height:4px;background:#0006;border-radius:3px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
#hpBar{background:var(--good)}#hpBox.low #hpBar{background:var(--bad)}#hpBox.hit{animation:hit .3s}
@keyframes hit{50%{background:#7a2340}}
.combo{margin-top:4px;font-size:12px;color:var(--mut)}
.combo b{color:var(--ink);font-size:14px;min-width:16px;display:inline-block;text-align:center}
#pips{display:flex;gap:3px;flex:1}#pips span{flex:1;height:8px;border-radius:3px;background:#0006;position:relative}#pips span.on{background:var(--info)}
#pips span.mark::after{content:attr(data-m);position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:8px;line-height:10px;color:#fff;font-weight:700}
#badges{display:flex;gap:3px}.badge{font-size:11px;padding:1px 5px;border-radius:6px;background:#0005;white-space:nowrap}
.badge.disc{background:#2d6a4f}.badge.buff{background:#9d4edd}.badge.ult{background:#c9184a}
.lvrow{margin-top:3px;font-size:11px;color:var(--mut)}.lvrow b{color:#e3d2ff;font-size:12px}.lvrow .bar{flex:1;margin:0}#xpBar{background:#c9a6ff}
#perkIcons{display:flex;gap:2px}.pico{font-size:10.5px;line-height:14px;padding:0 2px;border-radius:5px;border:1px solid var(--rc);background:#0004}
/* 맵 영역: 캔버스 = 이 컨테이너 크기(12 §3.7). 하늘은 CSS 그라디언트(난이도) */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;contain:strict;background:linear-gradient(var(--skyT,#7DB9EE),var(--skyH,#FFC890))}
#gl{position:absolute;left:0;top:0;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.cost{background:#1B2A41d9;color:#F4EAD5;border:2px solid #F2C14E;border-radius:10px;padding:1px 6px;font-size:13px;line-height:17px}
.cost.poor{opacity:.55;border-color:#0000}.cost.hl{box-shadow:0 0 0 2px #fff}
.tlab{background:#0d0b22d0;color:#fff;border-radius:7px;padding:0 5px;font-size:11px;line-height:15px}.tlab.low{color:#ff8a9a}
.ft{position:absolute;font-weight:800;font-size:15px;text-shadow:0 1px 2px #000;animation:ft .9s forwards;pointer-events:none}
@keyframes ft{to{transform:translate(-50%,-22px);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#perf{position:absolute;right:4px;top:3px;font:10px/1.3 ui-monospace,monospace;color:#fff;background:#0007;border-radius:5px;padding:1px 4px;pointer-events:none}
#perf.over{color:#ff8a9a}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;background:#000b;border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:10px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:3}
#banner.show{opacity:1}
#prep{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000b;color:var(--gold);border-radius:10px;padding:6px 18px;text-align:center;font-weight:700;pointer-events:none;white-space:nowrap}
#prep b{display:block;font-size:28px}
#popup{position:absolute;z-index:5;width:236px;background:#1b1842f2;border:1px solid var(--gold);border-radius:12px;padding:8px;box-shadow:0 8px 24px #000a}
#popup[hidden],#prep[hidden],[hidden]{display:none!important}
.ptitle{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.ptitle button{background:none;border:0;color:var(--mut);font-size:15px;padding:0 4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbtn{border:2px solid var(--c);background:#0004;border-radius:9px;padding:5px 4px;text-align:left;font-size:12px;line-height:1.25}
.pbtn .ic{font-size:16px;margin-right:2px}.pbtn small{display:block;color:var(--mut);font-size:10.5px}
.pbtn:disabled,.upbtn:disabled{opacity:.4;cursor:not-allowed}
.pinfo{font-size:12px;color:var(--mut);line-height:1.45;margin-bottom:6px}.pinfo b{color:var(--ink)}
.pterr{font-size:11.5px;color:#ffe27a;margin:-2px 0 6px}
.upbtn{width:100%;border:2px solid var(--gold);background:#4a3b0a;border-radius:9px;padding:7px;font-weight:700;font-size:14px}
#side{flex:none;display:flex;flex-direction:column;background:var(--bg);z-index:2}
#quiz{position:relative;margin:6px 8px 0;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 8px 7px}
#quiz.warn{animation:blink .5s steps(2) infinite}@keyframes blink{0%{border-color:var(--gold)}100%{border-color:var(--bad)}}
.qhead{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut);min-height:16px;white-space:nowrap;overflow:hidden}
#qFeedback{overflow:hidden;text-overflow:ellipsis}#qFeedback.good{color:var(--good)}#qFeedback.bad{color:var(--bad)}#qFeedback.skip{color:var(--gold)}
#qText{font-size:22px;font-weight:700;text-align:center;margin:1px 0 3px;min-height:30px;word-break:keep-all;transition:filter .15s,opacity .15s}
.idle{height:3px;background:#0005;border-radius:2px;overflow:hidden;margin-bottom:5px}.idle i{display:block;height:100%;width:0;background:var(--mut)}
#quiz.warn .idle i{background:var(--bad)}
#choices{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ch{position:relative;min-height:46px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:17px;font-weight:700;padding:10px 2px 4px;white-space:nowrap;transition:filter .15s,opacity .15s}
.ch .k{position:absolute;left:5px;top:2px;font-size:10px;color:var(--mut);font-weight:400}
.ch.correct{background:#145c43;border-color:var(--good)}.ch.correct::after{content:" ✓"}
.ch.wrong{background:#6a1d2c;border-color:var(--bad)}.ch.wrong::after{content:" ✗"}
#quiz.locked .ch{pointer-events:none}
#quiz.wlock{border-color:#6a5fb0}#quiz.wlock #qText{filter:blur(1.5px);opacity:.45}
#quiz.wlock .ch:not(.correct){filter:blur(1.5px);opacity:.35}
#lockBadge{position:absolute;right:8px;top:24px;z-index:2;background:#0d0b22e6;border:1px solid var(--bad);color:#ffd0d8;border-radius:9px;padding:3px 9px;font-weight:800;font-size:15px;pointer-events:none}
.r-common{--rc:#B9B3A6}.r-rare{--rc:#7CC0EC}.r-legendary{--rc:#F2C14E}
#draft{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#quiz.drafting{border-color:var(--gold)}#quiz.drafting #choices{display:none}#quiz.drafting #qText{opacity:.4}#quiz.drafting .idle i{background:var(--gold)}
.pcard{position:relative;min-height:62px;border:1.5px solid var(--rc);background:var(--panel2);border-radius:10px;padding:3px 5px 4px;text-align:left;line-height:1.2;display:flex;flex-direction:column;gap:1px}
.pcard.r-rare{border-width:2px}.pcard.r-legendary{border-width:3px}
.pcard .pr{font-size:10.5px;color:var(--rc);font-weight:700}.pcard .pk{position:absolute;right:5px;top:2px;font-size:10px;color:var(--mut)}
.pcard b{font-size:14px}.pcard small{font-size:11px;color:#ddd8ff;word-break:keep-all}
.pcard .pdef{position:absolute;right:4px;bottom:2px;font-size:9.5px;font-style:normal;color:var(--gold)}
#cardbar{display:grid;grid-template-columns:repeat(4,1fr) 1.15fr;gap:5px;padding:6px 8px 8px}
.card{position:relative;border:2px solid var(--c);background:#0003;border-radius:10px;padding:3px 2px 4px;text-align:center;font-size:11px;line-height:1.2}
.card .ic{font-size:18px;display:block}.card .k{position:absolute;left:4px;top:2px;font-size:9.5px;color:var(--mut)}
.card .cost2{color:var(--gold);font-weight:700}.card.sel{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 0 2px #fff inset}.card.poor{opacity:.5}
#ultBtn{border:2px solid #ff4d8d;background:#3a0f22;border-radius:10px;font-size:11px;line-height:1.2;padding:3px 2px;color:#ffb3cd}
#ultBtn .ic{font-size:18px;display:block}#ultBtn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.8)}#ultBtn.ready{animation:pulse 1s infinite;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 14px #ff4d8d}}
#overlay{position:absolute;inset:0;z-index:10;background:#0c0a1fe0;display:flex;align-items:center;justify-content:center;padding:12px}
#overlay.title{background:#0c0a1f8c}
.panel{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.panel h1{margin:0 0 2px;font-size:23px;text-align:center}.panel h2{margin:10px 0 4px;font-size:13.5px;color:var(--mut)}
.panel p{font-size:13px;line-height:1.5;margin:4px 0;color:#ddd8ff}.panel ul{margin:3px 0;padding-left:18px;font-size:12.3px;line-height:1.55;color:#ddd8ff}
.selcol{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.selcol label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mut)}
.selcol select{width:100%;min-height:34px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 5px;font:inherit;font-size:13px}
.mapinfo{font-size:11px;color:#ffe27a;line-height:1.45;margin-top:4px}
.stars{text-align:center;font-size:40px;letter-spacing:6px;color:var(--gold);margin:4px 0}.stars .off{color:#4a4570}
.crit{font-size:12.5px;line-height:1.7}.crit .ok{color:var(--good)}.crit .no{color:var(--mut)}
.big{display:block;width:100%;margin-top:10px;padding:11px;border-radius:11px;border:0;background:var(--gold);color:#241a00;font-weight:800;font-size:16px}
.sec{display:block;width:100%;margin-top:8px;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
.sealed{display:flex;flex-direction:column;gap:4px}
.sealed button{text-align:left;border:1px dashed #8a7fd0;background:#0003;border-radius:8px;padding:6px 8px;font-size:13px}
.sealed button.new::after{content:"NEW";font-size:9px;background:var(--bad);color:#fff;border-radius:4px;padding:0 3px;margin-left:6px}
.sealed button.freed{border-style:solid;border-color:var(--good);text-decoration:line-through;opacity:.6}
#review .rq{font-size:20px;font-weight:700;text-align:center;margin:6px 0}#review .rmsg{font-size:13px;text-align:center;min-height:18px;margin-top:6px}
#review .ch{padding:4px 6px 4px 22px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stats{font-size:12.5px;color:#ddd8ff;line-height:1.6}
.perklist div{font-size:12.3px;line-height:1.55}.perklist .rb{color:var(--rc);font-weight:700}
/* 가로(PC·태블릿): 맵 왼쪽,우측 패널 400px(05 §2.2),카메라 요 45° */
@media (orientation:landscape) and (min-width:700px){
body{align-items:stretch}
#app{max-width:none;max-height:none;height:100vh;display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;border-radius:0}
#hud{grid-column:1/3}#stage{grid-column:1;grid-row:2}
#hud{display:grid;grid-template-columns:300px minmax(0,1fr);column-gap:16px;align-items:center}
#hud>.run-nav{grid-row:1/4;margin-bottom:0}#hud>.hrow{grid-column:2}
#side{grid-column:2;grid-row:2;justify-content:center;border-left:1px solid var(--line)}
#choices{grid-template-columns:1fr 1fr}.ch{min-height:64px;font-size:20px}
}
</style>

<body>
<div id="app">
  <header id="hud">
    <nav class="run-nav" aria-label="실험실 메뉴"><a href="../index.html" data-hub>← 허브</a><span>3D 수학 실험실</span><button id="pauseBtn" disabled>일시정지</button></nav>
    <div class="hrow">
      <div class="stat" data-stat="hp" id="hpBox" title="탑 HP">🏰 <b id="hpTxt">10</b><small id="hpMax">/10</small> <span id="shieldTxt"></span><div class="bar"><i id="hpBar"></i></div></div>
      <div class="stat" data-stat="mana" title="마나 (아래 막대 = 자동 회복까지)">💎 <b id="manaTxt">0</b><small>마나</small><div class="bar"><i id="manaBar"></i></div></div>
      <div class="stat" data-stat="wave" title="웨이브">🌫️ <b id="waveTxt">1/5</b><small id="phaseTxt"></small></div>
    </div>
    <div class="hrow combo">콤보 <b id="comboTxt">0</b><div id="pips"></div><div id="badges"></div></div>
    <div class="hrow lvrow" id="lvRow"><b id="lvTxt">Lv1</b><div class="bar"><i id="xpBar"></i></div><span id="xpTxt">XP 0/15</span><div id="perkIcons"></div></div>
  </header>
  <div id="stage">
    <canvas id="gl" aria-label="게임 맵(3D)"></canvas>
    <div id="labels"></div>
    <button id="viewBtn" type="button" aria-pressed="false">전체 보기</button>
    <div id="flash"></div>
    <div id="prep" hidden></div>
    <div id="perf"></div>
    <div id="popup" hidden></div>
    <div id="banner"></div>
  </div>
  <div id="side">
    <section id="quiz" aria-live="polite">
      <div class="qhead"><span id="qDiff"></span><span id="qFeedback"></span></div>
      <div id="qText"></div>
      <div class="idle"><i id="idleBar"></i></div>
      <div id="choices"></div>
      <div id="draft" hidden></div>
      <div id="lockBadge" hidden></div>
    </section>
    <nav id="cardbar"></nav>
  </div>
  <div id="overlay"></div>
  <div id="pauseLayer" hidden role="dialog" aria-modal="true" aria-labelledby="pauseTitle" aria-describedby="pauseText">
    <div class="panel"><h2 id="pauseTitle">잠시 쉬어가요</h2><p id="pauseText"></p><button class="big" id="resumeBtn">이어하기</button><button class="sec" id="leaveBtn" hidden>허브로 돌아가기</button><a class="sec" href="../index.html" data-hub id="pauseHub">허브로 돌아가기</a></div>
  </div>
</div>

<script>
'use strict';
/* 4차 3D 게임 = 시뮬 코어(core/sim.js, 로직·수치 전부) + 렌더 어댑터 R(Three.js, snapshot 읽기 전용) + DOM UI.

const { PI, max, min, sin, cos, round, hypot, abs, floor, ceil } = Math, SIM = ArcanaSim, BAL = SIM.BALANCE, CT = SIM.CARD_TYPES, ET = SIM.ENEMY_TYPES;
const VIS = {
 step: 0.5, sink: 0.08, skirt: 0.9, lip: 0.06, jitter: 0.03, wallMin: 0.02,
 pitch: 55, yaw: { portrait: 0, landscape: 45 }, followTile: 34, margin: 8, longPress: 380, occlude: 1.7,
 ped: { tier: 0.14, r0: 0.45, rTop: 0.39 },
 tower: { h: [0.6,0.7,0.85,1.0], r: [0.28,0.31,0.35,0.39] },
 enemy: { size: [0.70,0.56,0.84,1.75], color: ['#DDD8F0', '#B9A8E6', '#A9AFBF', '#B3A3E0'], fog: '#6E5C9E', cap: [72,40,16,2], lane: 0.16, bob: 0.035, bar: [0.6,0.6,1.0,2.0] },
 ink: '#1B2A41', parch: '#F4EAD5', gold: '#E0A030', glow: '#F2C14E',
 card: { wand: ['#E0A030', '#F2C14E'], cup: ['#2F7DB8', '#7CC0EC'], sword: ['#F4EAD5', '#1B2A41'], pentacle: ['#6A593A', '#C9B68E'] },
 // 13 §1.2 팔레트 슬롯(M1 지면 M2 절벽 M3 길 M4 물 M5 받침대 top 윗판 M6 잎 M7 줄기)
 reg: [
  { M1: '#72B894', M2: '#6D8290', M3: '#54463A', M4: '#7DB7D9', M5: '#7E848F', top: '#F4EAD5', M6: '#319477', M7: '#7E6452' },
  { M1: '#408D80', M2: '#607A83', M3: '#4E4034', M4: '#5FA3B5', M5: '#C3CAC4', top: '#F4EAD5', M6: '#2F7A5C', M7: '#6F5238' },

  { M1: '#DDE3F1', M2: '#B4BCD4', M3: '#40476A', M4: '#F4F7FC', M5: '#7F869A', top: '#4A5675', M6: '#A9C7E6', M7: '#B8A58A' }],
 subj: ['#7AA2E8', '#E8A24A', '#58C2B0', '#C8665A'],
 // 13 §4.3 난이도 → 조명
 light: [
  { key: '#FFE9C2', el: 55, k: 1.0, sky: '#CFE6FF', gnd: '#9DB58C', h: 0.70, top: '#7DB9EE', hor: '#FFC890', haze: 0.10, expo: 1.00 },
  { key: '#FFE4BC', el: 42, k: 0.85, sky: '#BCDDF0', gnd: '#667E83', h: 0.62, top: '#183F59', hor: '#9CBEBA', haze: 0.18, expo: 0.90 },
  { key: '#BED9FF', el: 55, k: 0.55, sky: '#668BB2', gnd: '#2F445A', h: 0.55, top: '#101F36', hor: '#557C92', haze: 0.28, expo: 0.72 }],
 particles: 60, trees: 22, props: 3,

const $ = id=>document.getElementById(id);
const clamp = (v, a, b)=>max(a, min(b, v));
const V3 = THREE.Vector3, rad = d=>d * PI / 180, col = h=>new THREE.Color(h), mixC = (a, b, t)=>col(a).lerp(col(b), t);
const DEBUG_VIEW = new URLSearchParams(location.search).has('debug');
