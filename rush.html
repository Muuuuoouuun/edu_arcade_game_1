<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#12261c" />
    <title>아르카나 러시 · 프로토타입</title>
    <link rel="icon" type="image/svg+xml" href="/arcana-mark.svg" />
  </head>
  <body>
    <main id="rush">
      <canvas id="rush-canvas" aria-label="전장"></canvas>
      <div id="rush-surface"></div>
      <div id="rush-fx" aria-hidden="true"></div>

      <header class="hud-top">
        <div class="hud-wave"><b id="wave-label">웨이브 1/5</b><small id="wave-sub"></small></div>
        <div class="hud-town" aria-label="마을 체력"><span>마을</span><div class="bar"><i id="town-fill"></i></div><b id="town-hp">1000</b></div>
        <div class="hud-gold" aria-label="골드"><i class="coin"></i><b id="gold">60</b></div>
        <button id="pause" class="hud-icon" aria-label="일시정지">Ⅱ</button>
      </header>
      <p id="toast" class="toast" role="status"></p>
      <p id="debug" class="debug" hidden></p>

      <button id="start-wave" class="hud-pill" hidden>웨이브 시작</button>
      <button id="build" class="hud-build" hidden>궁수탑 건설</button>

      <div id="stick" class="stick" aria-hidden="true"><i id="stick-knob"></i></div>
      <button id="super" class="btn-super" aria-label="필살기: 탭하면 자동, 끌면 조준"><span id="super-ring" class="ring"></span><span class="label">필살</span></button>
      <button id="fire" class="btn-fire" aria-label="공격: 탭하면 자동 조준, 끌면 직접 조준"><span class="glyph">➶</span><span class="ammo"><i></i><i></i><i></i></span></button>

      <section id="screen-title" class="screen">
        <div class="card">
          <p class="eyebrow">PROTOTYPE v0 · ARCANA RUSH</p>
          <h1>아르카나 러시</h1>
          <p class="tag">직접 싸우고, 탑을 세우고, 마을을 지켜라.</p>
          <ul class="howto">
            <li><b>이동</b> 왼쪽 화면 끌기 · WASD</li>
            <li><b>공격</b> 공격 버튼 탭 = 자동 조준, 끌기 = 직접 조준 · 마우스 클릭</li>
            <li><b>필살기</b> 명중으로 충전, 보라 버튼 · Space</li>
            <li><b>궁수탑</b> 노란 원 위에서 건설·강화 · E</li>
          </ul>
          <div class="actions"><button id="btn-play" class="primary">전투 시작</button><button id="btn-demo">자동 시연</button></div>
          <p class="note">5웨이브 · 약 2~3분. 영웅만으로도, 탑만으로도 지키기 어렵습니다.</p>
        </div>
      </section>
      <section id="screen-result" class="screen" hidden>
        <div class="card">
          <p class="eyebrow">RESULT</p>
          <h1 id="result-title">결과</h1>
          <dl id="result-stats" class="stats"></dl>
          <div class="actions"><button id="btn-again" class="primary">다시 하기</button><button id="btn-title">타이틀</button></div>
        </div>
      </section>
      <section id="screen-pause" class="screen" hidden>
        <div class="card small">
          <h1>일시정지</h1>
          <div class="actions"><button id="btn-resume" class="primary">계속</button><button id="btn-quit">타이틀로</button></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/rush/main.ts"></script>
  </body>
</html>
